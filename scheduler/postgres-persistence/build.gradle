dependencies {
    implementation project(':conductor-scheduler-core')
    implementation project(':conductor-common')
    implementation project(':conductor-core')
    implementation project(':conductor-postgres-persistence')

    compileOnly 'org.springframework.boot:spring-boot-starter'

    implementation "tools.jackson.core:jackson-databind"
    implementation "tools.jackson.core:jackson-core"

    implementation "org.apache.commons:commons-lang3"
    implementation "org.postgresql:postgresql:${revPostgres}"
    implementation "org.flywaydb:flyway-core"
    implementation "org.springframework.boot:spring-boot-flyway"
    implementation "org.springframework.boot:spring-boot-jdbc"
    implementation "org.flywaydb:flyway-database-postgresql"

    testImplementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "org.testcontainers:postgresql:${revTestContainer}"
    testImplementation testFixtures(project(':conductor-scheduler-core'))
}

test {
    maxParallelForks = 1
    // Docker Desktop on macOS requires API v1.44+; docker-java defaults to v1.41
    environment 'DOCKER_API_VERSION', '1.44'
}
