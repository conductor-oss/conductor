# Runs integration Playwright against a live Conductor backend in a consistent
# Linux + Chromium environment so screenshot baselines match locally and in CI.
#
# Usage (from ui-next/):
#   pnpm test:e2e:integration              # via scripts/run-integration-e2e.sh
#   pnpm test:e2e:integration:update-snapshots
#
# Prerequisites:
#   - conductor:server image built (script builds it if missing)
#   - dist/ present (script runs pnpm build if missing)

services:
  mock-openai:
    image: node:20-slim
    command: ["node", "/mock/server.mjs"]
    volumes:
      - ./e2e/integration/mock-openai:/mock:ro
    networks:
      - internal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8090/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 30

  conductor-postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=conductor
      - POSTGRES_PASSWORD=conductor
    networks:
      - internal
    healthcheck:
      test: timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/5432'
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: "json-file"
      options:
        max-size: "1k"
        max-file: "3"

  conductor-server:
    image: conductor:server
    build:
      context: ..
      dockerfile: docker/server/Dockerfile
    environment:
      - CONFIG_PROP=config-postgres.properties
      - conductor.app.ownerEmailMandatory=false
      # OpenAI calls (LLM_* tasks via conductor.ai.openai.*, agents via OPENAI_BASE_URL)
      # go to the mock-openai stub so LLM execution tests are deterministic and need
      # no key. To hit real OpenAI instead, set E2E_OPENAI_BASE_URL=https://api.openai.com/v1
      # and OPENAI_API_KEY on the host.
      - CONDUCTOR_AI_OPENAI_BASEURL=${E2E_OPENAI_BASE_URL:-http://mock-openai:8090/v1}
      - OPENAI_BASE_URL=${E2E_OPENAI_BASE_URL:-http://mock-openai:8090/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-e2e-mock-key}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 24
    links:
      - conductor-postgres:postgresdb
    depends_on:
      conductor-postgres:
        condition: service_healthy
      mock-openai:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10k"
        max-file: "3"

  app:
    image: node:20-slim
    working_dir: /app
    volumes:
      - .:/app
      - integration_app_modules:/app/node_modules
    networks:
      - internal
    environment:
      CI: "true"
      npm_config_store_dir: /root/.pnpm-store
      # Preview proxy target — Docker DNS name on the internal network.
      VITE_WF_SERVER: http://conductor-server:8080
    depends_on:
      conductor-server:
        condition: service_healthy
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm preview --host 0.0.0.0 --port 1234"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "require('http').get('http://localhost:1234',
            r => process.exit(r.statusCode < 400 ? 0 : 1)
          ).on('error', () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s

  playwright:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    working_dir: /app
    volumes:
      - .:/app
      - integration_pw_modules:/app/node_modules
    # Share the app container's network so localhost:1234 is preview and
    # conductor-server resolves on the same Docker network.
    network_mode: "service:app"
    depends_on:
      app:
        condition: service_healthy
    environment:
      CI: "true"
      npm_config_store_dir: /root/.pnpm-store
      BASE_URL: http://localhost:1234
      CONDUCTOR_SERVER_URL: http://conductor-server:8080
      SKIP_DOCKER: "true"
      SKIP_WEBSERVER: "true"
      E2E_COVERAGE: ${E2E_COVERAGE:-}
      PLAYWRIGHT_FLAGS: ${PLAYWRIGHT_FLAGS:-}
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm exec playwright test --config playwright.integration.config.ts $${PLAYWRIGHT_FLAGS:-}"

networks:
  internal:

volumes:
  integration_app_modules:
  integration_pw_modules:
