// Overrides for the Spring Boot Dependency Management plugin.
//
// Everything not listed here is taken from the Spring Boot BOM. Each override below must state why
// it deviates, using the same prefixes used elsewhere in the build: PINNED, Security, Compat.
// Supported override property names are listed at
// https://docs.spring.io/spring-boot/4.1/appendix/dependency-versions/properties.html

// Security: the Boot 4.1 BOM pins com.rabbitmq:amqp-client to 5.30.0, which carries
// CVE-2026-63337 / CVE-2026-69219 / CVE-2026-69220. This property is what actually forces
// revAmqpClient (5.35.0) into the shaded jar; the amqp module's explicit version is otherwise
// overridden back down to the BOM version by the dependency-management plugin.
ext['rabbit-amqp-client.version'] = revAmqpClient

// Compat: Conductor ships selectable indexing backends (ES6/ES7/ES8 and OpenSearch) and picks one at
// build time. The Spring Boot BOM tracks the latest Elasticsearch client, which does not speak to the
// older clusters Conductor still supports, so the Elasticsearch coordinates are managed here instead.
// Default is ES7; the ES8 branch below switches both the transport and the java client together.
ext['elasticsearch.version'] = revElasticSearch7
ext['elasticsearch-client.version'] = revElasticSearch7

def indexingBackend = findProperty('indexingBackend') ?: 'elasticsearch'
if (indexingBackend == 'elasticsearch8' || indexingBackend == 'es8') {
    ext['elasticsearch.version'] = revElasticSearch8
    ext['elasticsearch-client.version'] = revElasticSearch8
}

// Compat: the Spring Boot BOM manages Testcontainers 2.x, which reorganises the container classes
// Conductor's tests build on. Staying on 1.x until the Testcontainers 2 migration is done separately.
ext['testcontainers.version'] = revTestContainer
