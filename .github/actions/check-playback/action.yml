name: Check LLM playback
description: Pass if every workflow on the playback server completed, fail otherwise.
inputs:
  server-url:
    description: Conductor API URL reachable from this runner, including /api.
    required: true
runs:
  using: composite
  steps:
    - name: Check playback
      shell: sh
      run: sh "$GITHUB_ACTION_PATH/check-playback.sh" "${{ inputs.server-url }}"
