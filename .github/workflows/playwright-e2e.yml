name: Trigger Playwright E2E Tests

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "ui-next/**"
      - ".github/workflows/playwright-e2e.yml"
  workflow_dispatch:
    inputs:
      conductor_ui_branch:
        description: "conductor-ui branch to test against"
        required: false
        default: "main"

# Fire-and-forget: kick off Orkes Playwright in conductor-ui. Do not write
# commit statuses back onto this repo — a conductor-ui failure must not
# make OSS CI red. Results live only in conductor-ui Actions.
jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve conductor-ui branch from PR body
        id: resolve
        run: |
          if [ -n "${{ inputs.conductor_ui_branch }}" ]; then
            echo "branch=${{ inputs.conductor_ui_branch }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          BODY=$(cat <<'PRBODY'
          ${{ github.event.pull_request.body }}
          PRBODY
          )
          PARSED=$(echo "$BODY" | grep -oP '(?<=conductor-ui-branch:\s).+' | head -1 | xargs)
          if [ -n "$PARSED" ]; then
            echo "branch=$PARSED" >> $GITHUB_OUTPUT
          else
            echo "branch=main" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Playwright tests in conductor-ui
        env:
          GH_TOKEN: ${{ secrets.ORKES_INTERNAL_RUNNER_SECRET }}
        run: |
          RESULTS_URL="https://github.com/orkes-io/conductor-ui/actions"
          echo "Playwright E2E results (if dispatched) appear only at: ${RESULTS_URL}"

          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "Skipping dispatch for fork PRs (no access to conductor-ui dispatch secret)."
            exit 0
          fi

          if [ -z "${GH_TOKEN}" ]; then
            echo "Skipping dispatch: ORKES_INTERNAL_RUNNER_SECRET is not available."
            echo "This is expected on fork PRs and must not fail OSS CI."
            exit 0
          fi

          if ! gh api repos/orkes-io/conductor-ui/dispatches \
            -f event_type=oss-pr-playwright \
            -f "client_payload[oss_ref]=${{ github.event.pull_request.head.sha || github.sha }}" \
            -f "client_payload[oss_pr_number]=${{ github.event.pull_request.number || '' }}" \
            -f "client_payload[oss_pr_title]=${{ github.event.pull_request.title || 'manual dispatch' }}" \
            -f "client_payload[conductor_ui_branch]=${{ steps.resolve.outputs.branch }}"; then
            echo "conductor-ui dispatch failed; not failing OSS CI."
            echo "Inspect ${RESULTS_URL} if a run was created."
            exit 0
          fi

          echo "Dispatched oss-pr-playwright to orkes-io/conductor-ui (branch ${{ steps.resolve.outputs.branch }})."
