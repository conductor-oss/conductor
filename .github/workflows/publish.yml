name: Publish Conductor OSS to Maven Central
on:
  release:
    types:
      - released
      - prereleased
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., v1.0.0)'
        required: true
permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    name: Resolve release version
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve and validate release tag
        id: resolve
        # Release events publish the release's tag. Manual runs publish the
        # `version` input -- the "Use workflow from" branch only picks which
        # copy of this workflow runs. Anything that is not a release tag
        # (e.g. a run from main, which used to publish version "ain") stops
        # here, before any build or publish.
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag (expected e.g. v3.33.0, v3.33.0-rc1)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Publishing tag $TAG as version ${TAG#v}"

  publish:
    needs: resolve-version
    runs-on: ubuntu-latest
    name: Gradle Build and Publish
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve-version.outputs.tag }}
      - name: Set up Zulu JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Publish release
        run: |
          echo Publishing version $PUBLISH_VERSION
          ./gradlew publish -PmavenCentral -Pversion=$PUBLISH_VERSION -Pusername=${{ secrets.SONATYPE_USERNAME }} -Ppassword=${{ secrets.SONATYPE_PASSWORD }}
        env:
          PUBLISH_VERSION: ${{ needs.resolve-version.outputs.version }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
      - name: Point SDK e2e workflows at this version
        # Publishes the org-level E2E_TEST_OSS_CONDUCTOR_VERSION variable -- the
        # single version both SDK e2e paths read:
        #   - pull_request.yml docker-compose e2e (a conductoross/conductor
        #     Docker Hub image tag)
        #   - agent-e2e.yml (a conductor-server boot JAR on Maven Central)
        # A concrete release (e.g. 3.33.0) is valid in both registries, so one
        # variable serves both. It must never be set to `latest` -- Maven Central
        # has no `latest`, so the agent-e2e JAR download would 404.
        #
        # Requires ORG_VARS_TOKEN: a fine-grained PAT or GitHub App token with
        # organization "Variables: write" on conductor-oss. The default GITHUB_TOKEN
        # and CI_UTIL_DISPATCH_TOKEN do NOT carry this scope (that gap is what made
        # this step 403 and red-flag otherwise-successful publishes).
        env:
          GH_TOKEN: ${{ secrets.ORG_VARS_TOKEN }}
          PUBLISH_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          gh variable set E2E_TEST_OSS_CONDUCTOR_VERSION \
            --org conductor-oss \
            --body "$PUBLISH_VERSION"

  publish-docker:
    needs: resolve-version
    runs-on: ubuntu-latest
    name: Gradle Build and Publish to Container Registry
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve-version.outputs.tag }}
      - name: Set up Zulu JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Login to Docker Hub Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build ui-next and embed into server static resources
        run: |
          corepack enable
          cd ui-next
          pnpm install
          NODE_OPTIONS=--max-old-space-size=4096 pnpm build
          cd ..
          mkdir -p server/src/main/resources/static
          rm -rf server/src/main/resources/static/*
          cp -r ui-next/dist/. server/src/main/resources/static/

      - name: Build Server JAR
        env:
          PUBLISH_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          echo Publishing version $PUBLISH_VERSION
          ./gradlew :conductor-server:build -x test -x spotlessCheck -x shadowJar -x :conductor-os-persistence-v3:build \
            -Pversion=$PUBLISH_VERSION

      - name: Stage artifacts for Docker build
        run: |
          mkdir -p docker/server/libs
          cp server/build/libs/*boot*.jar docker/server/libs/conductor-server.jar

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/server/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: |
            PREBUILT=true
          tags: |
            conductoross/conductor:${{ needs.resolve-version.outputs.version }}
            orkesio/orkes-conductor-community-standalone:${{ needs.resolve-version.outputs.version }}
            orkesio/orkes-conductor-community:${{ needs.resolve-version.outputs.version }}
            ${{ (github.event_name == 'release' && !github.event.release.prerelease && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'alpha')) && 'conductoross/conductor:latest' || '' }}
            ${{ (github.event_name == 'release' && !github.event.release.prerelease && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'alpha')) && 'orkesio/orkes-conductor-community-standalone:latest' || '' }}
            ${{ (github.event_name == 'release' && !github.event.release.prerelease && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'alpha')) && 'orkesio/orkes-conductor-community:latest' || '' }}