name: Test org var visibility

# Throwaway test: does `gh variable set` (as publish.yml runs it, without
# --visibility) reset the visibility of E2E_TEST_OSS_CONDUCTOR_VERSION?
on:
  push:
    branches:
      - ci/test-org-var-visibility

permissions:
  contents: read

jobs:
  set-and-restore:
    runs-on: ubuntu-latest
    steps:
      - name: Set E2E_TEST_OSS_CONDUCTOR_VERSION to 3.34.0-rc2
        env:
          GH_TOKEN: ${{ secrets.ORG_VARS_TOKEN }}
          PUBLISH_VERSION: 3.34.0-rc2
        run: |
          gh variable set E2E_TEST_OSS_CONDUCTOR_VERSION \
            --org conductor-oss \
            --body "$PUBLISH_VERSION"
      - name: Wait for manual check
        run: sleep 30
      - name: Restore E2E_TEST_OSS_CONDUCTOR_VERSION to 3.34.0-rc3
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ORG_VARS_TOKEN }}
          PUBLISH_VERSION: 3.34.0-rc3
        run: |
          gh variable set E2E_TEST_OSS_CONDUCTOR_VERSION \
            --org conductor-oss \
            --body "$PUBLISH_VERSION"
