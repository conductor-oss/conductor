name: UI v2 Integration CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "ui/**"
      - "ui-next/**"
  push:
    branches:
      - main
    paths:
      - "ui/**"
      - "ui-next/**"

permissions:
  contents: read

jobs:
  e2e-integration:
    name: E2E (Integration)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean

      # ── Docker image build (started first, runs in the background) ─────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers for conductor:server
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-conductor-server-${{ hashFiles('docker/server/Dockerfile', '**/build.gradle', 'settings.gradle') }}
          restore-keys: ${{ runner.os }}-conductor-server-

      - name: Build conductor:server image (background)
        run: |
          nohup bash -c '
            docker buildx build \
              --file docker/server/Dockerfile \
              --tag conductor:server \
              --build-arg SKIP_UI=true \
              --cache-from type=local,src=/tmp/.buildx-cache \
              --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=min \
              --load \
              . > /tmp/docker-build.log 2>&1
            echo $? > /tmp/docker-build-exit
          ' &
          echo $! > /tmp/docker-build.pid
          echo "Docker build started in background (PID: $(cat /tmp/docker-build.pid))"

      # ── Node / Playwright setup (runs while Docker builds) ─────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.0

      # setup-node must come after pnpm/action-setup so it can locate the store.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui-next/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ui-next

      - name: Build UI (with coverage sourcemaps)
        run: pnpm build
        working-directory: ui-next
        env:
          E2E_COVERAGE: "true"
          NODE_OPTIONS: --max-old-space-size=8192

      # ── Sync: wait for the Docker build to finish ──────────────────────
      - name: Wait for Docker build
        run: |
          PID=$(cat /tmp/docker-build.pid)
          echo "Waiting for Docker build (PID: $PID)..."
          while kill -0 "$PID" 2>/dev/null; do
            sleep 5
          done
          EXIT_CODE=$(cat /tmp/docker-build-exit)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Docker build failed (exit $EXIT_CODE)"
            cat /tmp/docker-build.log
            exit 1
          fi
          echo "Docker build completed successfully"

      - name: Rotate Docker layer cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Run integration E2E tests with coverage
        run: pnpm test:e2e:integration
        working-directory: ui-next
        env:
          E2E_COVERAGE: "true"
          # dist/ already built above — skip rebuild inside the wrapper script.
          SKIP_WEBSERVER_BUILD: "true"
          # Forwarded into docker-compose.integration.yml for LLM task execution;
          # also gates the LLM "completes successfully" Playwright tests.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Generate frontend coverage report and enforce threshold
        if: success() || failure()
        run: node scripts/playwright-coverage-report.mjs
        working-directory: ui-next

      - name: Upload Playwright integration report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-integration-report
          path: ui-next/playwright-integration-report/
          retention-days: 7

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage-report
          path: ui-next/playwright-coverage-report/
          retention-days: 14
