/*
 * Common place to define all the version dependencies.
 *
 * Only libraries the Spring Boot BOM does not manage belong here. If the BOM manages a library,
 * declare the dependency without a version and let the BOM decide.
 */
ext {
    revAwsSdk = '2.31.68'
    revBval = '2.0.5'
    revCassandra = '3.10.2'
    revCassandraUnit = '3.11.2.0'
    revCommonsIo = '2.18.0'
    revElasticSearch6 = '6.8.23'
    revEmbeddedRedis = '0.6'
    revGrpc = '1.75.0'
    revGuava = '33.2.1-jre'
    revHamcrestAllMatchers = '1.8'
    revHealth = '1.1.4'
    revPostgres = '42.7.11'

    // -----------------------------------------------------------------
    // PINNED DEPENDENCIES - do not upgrade without reading the notes.
    // See: https://github.com/conductor-oss/conductor/issues/964
    // -----------------------------------------------------------------

    // protobuf 4.x. The 3.x pin from #964 existed because protobuf 4 combined with GraalVM
    // polyglot 24.x made Gradle ask for an org.graalvm.polyglot:polyglot4 artifact that does not
    // exist; GraalVM 25 resolves cleanly. Spring Boot 4 forces the move anyway, since the OTLP
    // metrics registry now pulls opentelemetry-proto built against protobuf 4.
    revProtoBuf = '4.34.0'

    // PINNED (#964): GraalVM polyglot artifacts - ALL must be the same version.
    // Mixing versions (e.g. polyglot:24.x with js:25.x) causes a runtime
    // "polyglot version X is not compatible with Truffle Y" error.
    // When upgrading, bump revGraalVM everywhere it is referenced and test.
    // core/build.gradle uses this variable for all five GraalVM artifacts.
    revGraalVM = '25.0.2'
    revJAXRS = '4.0.0'
    revJsonPath = '2.4.0'
    revJq = '2.0.0-alpha1'

    // Compat: Spring Boot 4 dropped spring-retry from its BOM in favour of the retry support that
    // moved into spring-core. spring-retry 2.0.13 declares its Spring dependency as optional, so it
    // runs against Framework 7 unchanged. Tracked in issues.md for a later move to core retry.
    revSpringRetry = '2.0.13'
    revMockServerClient = '5.12.0'
    revSpringDoc = '3.1.0'
    revOrkesQueues = '2.0.0.rc3'
    revPowerMock = '2.0.9'
    revProtogenAnnotations = '1.0.0'
    revProtogenCodegen = '1.4.0'
    revRarefiedRedis = '0.0.17'
    revRedisson = '3.22.0'
    revRxJava = '1.2.2'
    revSpock = '2.4-groovy-5.0'
    revSpotifyCompletableFutures = '0.3.3'
    revTestContainer = '1.21.4'
    revAmqpClient = '5.13.0'
    revElasticSearch7 = '7.17.29'
    revElasticSearch8 = '8.19.11'
    revCodec = '1.15'
    revAzureStorageBlobSdk = '12.25.1'
    revNatsStreaming = '2.6.5'
    revNats = '2.16.14'
    revStan = '2.2.3'
    revConductorClient = '5.0.1'
    revReactor = '1.3.1'
    revSpringAI = '2.0.1'
    revJSonSchemaValidator  = '3.0.7'
    mongodb = '4.11.0'
    pgVector = '0.1.4'
    sqliteJdbc = '3.49.0.0'
    revMCP = '1.0.0'
    revCommonsCompress = '1.26.1'
    pinecone = '3.0.0'
    revFlexmark = '0.64.8'
}
