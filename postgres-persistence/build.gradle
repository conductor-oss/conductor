dependencies {

    implementation project(':conductor-common-persistence')
    implementation project(':conductor-common')
    implementation project(':conductor-core')

    compileOnly 'org.springframework.boot:spring-boot-starter'

    implementation "com.google.guava:guava:${revGuava}"

    implementation "tools.jackson.core:jackson-databind"
    implementation "tools.jackson.core:jackson-core"

    implementation "org.apache.commons:commons-lang3"
    implementation "org.postgresql:postgresql:${revPostgres}"
    implementation "org.springframework.boot:spring-boot-starter-jdbc"
    implementation "org.springframework.boot:spring-boot-flyway"
    implementation "org.flywaydb:flyway-core"
    implementation "org.flywaydb:flyway-database-postgresql"

    testImplementation "org.apache.groovy:groovy"
    testImplementation "org.apache.groovy:groovy-json"
    testImplementation project(':conductor-server')
    testImplementation project(':conductor-grpc-client')
    testImplementation project(':conductor-es7-persistence')

    testImplementation "org.testcontainers:postgresql:${revTestContainer}"
    testImplementation "org.testcontainers:elasticsearch:${revTestContainer}"

    testImplementation rootProject.project(':conductor-test-util').sourceSets.test.output
    testImplementation rootProject.project(':conductor-common-persistence').sourceSets.test.output
    testImplementation "redis.clients:jedis"
    testImplementation "org.awaitility:awaitility"

}

// These gRPC e2e tests run against the ES7 harness in AbstractEndToEndTest
// (7.17 container, ES7 client, conductor.elasticsearch.version=7). conductor-server
// now defaults to es8, which would put a second Elasticsearch IndexDAO configuration
// on the test classpath and collide with es7 at Spring context load (duplicate
// 'restClient' bean). Keep these tests on es7 only.
configurations.testRuntimeClasspath {
    exclude group: 'org.conductoross', module: 'conductor-es8-persistence'
}

test {
    //the SQL unit tests must run within the same JVM to share the same embedded DB
    maxParallelForks = 1
}
