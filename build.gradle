import org.springframework.boot.gradle.plugin.SpringBootPlugin

buildscript {
    repositories {
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath 'org.springframework.boot:spring-boot-gradle-plugin:3.3.11'
        classpath 'com.diffplug.spotless:spotless-plugin-gradle:6.+'
    }
}

plugins {
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'application'
    id 'maven-publish'
    id 'signing'
    id 'java-library'
    id "com.diffplug.spotless" version "6.25.0"
    id 'org.springframework.boot' version '3.3.11'
}

// Establish version and status
ext.githubProjectName = rootProject.name // Change if github project name is not the same as the root project's name

ext["tomcat.version"] = "10.1.52"

subprojects {
    tasks.withType(Javadoc).all { enabled = false }
}

apply from: "$rootDir/dependencies.gradle"
apply from: "$rootDir/springboot-bom-overrides.gradle"
apply from: "$rootDir/deploy.gradle"

allprojects {
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'java-library'
    apply plugin: 'project-report'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    group = 'org.conductoross'

    configurations {
        all {
            exclude group: 'ch.qos.logback', module: 'logback-classic'
            exclude group: 'ch.qos.logback', module: 'logback-core'
            exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
            exclude group: 'org.slf4j', module: 'slf4j-log4j12'
            exclude group: 'cglib', module: 'cglib'
            exclude group: 'cglib', module: 'cglib-nodep'
            exclude group: 'commons-configuration', module: 'commons-configuration'
            exclude group: 'org.springframework.ai', module: 'spring-ai-template-st'
            exclude group: 'org.antlr', module: 'ST4'
            exclude group: 'org.antlr', module: 'antlr-runtime'

            resolutionStrategy.eachDependency { details ->
                if (details.requested.group.startsWith('com.fasterxml.jackson.') ) {
                    details.useVersion "2.18.0"
                }
                // Force commons-lang3 to 3.18.0+ for compatibility with commons-compress used by Testcontainers
                if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-lang3') {
                    details.useVersion "3.18.0"
                }
                // Force commons-configuration2 to 2.11.0 (latest stable 2.x) if used
                if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-configuration2') {
                    details.useVersion "2.11.0"
                }
                // Force commons-configuration 1.x to redirect to commons-configuration2 as safety net
                if (details.requested.group == 'commons-configuration' && details.requested.name == 'commons-configuration') {
                    details.useTarget 'org.apache.commons:commons-configuration2:2.11.0'
                }
                // Force cglib to 3.3.0 to resolve COR-EL exclusion (versions <= 3.2.5 are prohibited)
                if (details.requested.group == 'cglib' && (details.requested.name == 'cglib' || details.requested.name == 'cglib-nodep')) {
                    details.useVersion "3.3.0"
                }
                // Force all Netty components to fixed version (excluding newer/experimental components)
                if (details.requested.group == 'io.netty' && 
                    !details.requested.name.contains('tcnative') && 
                    !details.requested.name.contains('http3') &&
                    !details.requested.name.contains('quic') &&
                    !details.requested.name.contains('codec-base') &&
                    !details.requested.name.contains('codec-compression')) {
                    details.useVersion revNetty
                }
                // Force Micrometer to prevent version downgrade that brings vulnerable Netty
                if (details.requested.group == 'io.micrometer' && details.requested.name.startsWith('micrometer-')) {
                    details.useVersion revMicrometer
                }
                // Force Netty codec specifically for Micrometer transitive dependencies
                if (details.requested.group == 'io.netty' && details.requested.name == 'netty-codec') {
                    details.useVersion revNetty
                }
            }
        }
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            // dependency versions for the BOM can be found at https://docs.spring.io/spring-boot/docs/3.1.4/reference/htmlsingle/#appendix.dependency-versions
            mavenBom(SpringBootPlugin.BOM_COORDINATES)
        }
    }

    dependencies {
        // Force cglib to safe version via dependency constraints
        constraints {
            implementation('cglib:cglib:3.3.0') {
                because 'COR-EL: cglib versions <= 3.2.5 are prohibited'
            }
            implementation('cglib:cglib-nodep:3.3.0') {
                because 'COR-EL: cglib versions <= 3.2.5 are prohibited'
            }
            testImplementation('cglib:cglib:3.3.0') {
                because 'COR-EL: cglib versions <= 3.2.5 are prohibited'
            }
            testImplementation('cglib:cglib-nodep:3.3.0') {
                because 'COR-EL: cglib versions <= 3.2.5 are prohibited'
            }
        }

        implementation('org.apache.logging.log4j:log4j-core')
        implementation('org.apache.logging.log4j:log4j-api')
        implementation('org.apache.logging.log4j:log4j-slf4j-impl')
        implementation('org.apache.logging.log4j:log4j-jul')
        implementation('org.apache.logging.log4j:log4j-web')
        implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"
        implementation "com.networknt:json-schema-validator:${revJSonSchemaValidator}"
        compileOnly 'org.projectlombok:lombok:1.18.42'

        annotationProcessor 'org.projectlombok:lombok:1.18.42'
        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

        testImplementation('org.springframework.boot:spring-boot-starter-test')
        testImplementation('org.springframework.boot:spring-boot-starter-log4j2')
        testImplementation 'junit:junit'
        testImplementation "org.junit.vintage:junit-vintage-engine"
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'

        //Locks for the dependecies
        implementation('org.codehaus.jettison:jettison') {
            version {
                strictly '1.5.4'
            }
        }
        implementation('org.apache.tomcat.embed:tomcat-embed-core')
    }
    // processes additional configuration metadata json file as described here
    // https://docs.spring.io/spring-boot/docs/2.3.1.RELEASE/reference/html/appendix-configuration-metadata.html#configuration-metadata-additional-metadata
    compileJava.inputs.files(processResources)

    test {
        useJUnitPlatform()
        testLogging {
            events = ["SKIPPED", "FAILED"]
            exceptionFormat = "full"
            displayGranularity = 1
            showStandardStreams = false
        }
    }
    bootJar {
        enabled = false
    }
}

// all client and their related modules are published with Java 17 compatibility
["annotations", "common", "grpc", "grpc-client"].each {
    project(":conductor-$it") {
        compileJava {
            options.release = 21
        }
    }
}

task server {
    dependsOn ':conductor-server:bootRun'
}

configure(allprojects - project(':conductor-grpc')) {
    apply plugin: 'com.diffplug.spotless'

    spotless {
        java {
            googleJavaFormat().aosp()
            removeUnusedImports()
            importOrder('java', 'javax', 'org', 'com.netflix', '', '\\#com.netflix', '\\#')
            licenseHeaderFile("$rootDir/licenseheader.txt")
        }
    }
}

['cassandra-persistence', 'core', 'redis-concurrency-limit', 'test-harness'].each {
    configure(project(":conductor-$it")) {
        spotless {
            groovy {
                importOrder('java', 'javax', 'org', 'com.netflix', '', '\\#com.netflix', '\\#')
                licenseHeaderFile("$rootDir/licenseheader.txt")
            }
        }
    }
}
